#####################################################################
# Ender 3 Pro + Creality 1.1.3
# Klipper macros
#
# Bed: 235x235 mm
# Nozzle: 0.4 mm
# Stock Bowden extruder
#####################################################################


#####################################################################
# VARIABLES
#####################################################################

[gcode_macro _MACRO_VARIABLES]
variable_park_x: 220
variable_park_y: 220
variable_park_z: 10

variable_purge_x: 5
variable_purge_y: 10
variable_purge_length: 50

variable_retract_distance: 2
variable_retract_speed: 1800

gcode:
    # Internal variables only


#####################################################################
# START PRINT
#
# Slicer:
# START_PRINT BED_TEMP=[first_layer_bed_temperature]
#            EXTRUDER_TEMP=[first_layer_temperature]
#####################################################################

[gcode_macro START_PRINT]
description: Start print sequence
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    M117 Preparing...

    # Reset G-code state
    G90
    M83

    # Disable unnecessary heaters/fans
    M107

    # Heat bed first
    M140 S{BED_TEMP}

    # Home while bed is heating
    M117 Homing...
    G28

    # Wait for bed
    M117 Heating bed...
    M190 S{BED_TEMP}

    # Optional bed mesh
    # Uncomment if you want automatic mesh calibration
    # BED_MESH_CALIBRATE

    # Move nozzle to safe position
    G1 Z10 F3000

    # Heat nozzle
    M117 Heating nozzle...
    M104 S{EXTRUDER_TEMP}

    # Wait for nozzle
    M109 S{EXTRUDER_TEMP}

    # Move to purge position
    G1 X5 Y10 Z0.28 F5000

    # Reset extruder
    G92 E0

    # Purge line
    G1 X55 Y10 Z0.28 F1500 E6

    # Wipe
    G1 X60 Y10 Z0.28 F5000

    # Reset extruder
    G92 E0

    M117 Printing...


#####################################################################
# END PRINT
#####################################################################

[gcode_macro END_PRINT]
description: End print sequence
gcode:

    M117 Print finished

    # Turn off heaters
    M104 S0
    M140 S0
    M106 S0

    # Retract filament
    G91
    G1 E-2 F1800

    # Raise nozzle
    G1 Z10 F3000

    # Absolute positioning
    G90

    # Park nozzle
    G1 X220 Y220 F6000

    # Disable motors
    M84

    M117 Finished!


#####################################################################
# PAUSE
#####################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause print and park nozzle
gcode:

    {% set E = params.E|default(2)|float %}

    SAVE_GCODE_STATE NAME=PAUSE_state

    BASE_PAUSE

    G91

    # Retract
    G1 E-{E} F1800

    # Raise nozzle
    G1 Z10 F3000

    G90

    # Park
    G1 X220 Y220 F6000

    M117 Paused


#####################################################################
# RESUME
#####################################################################

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Resume print
gcode:

    {% set E = params.E|default(2)|float %}

    M117 Resuming...

    G91

    # Prime filament
    G1 E{E} F1800

    G90

    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1

    BASE_RESUME


#####################################################################
# CANCEL PRINT
#####################################################################

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel current print
gcode:

    M117 Cancelling...

    TURN_OFF_HEATERS
    M107

    G91

    # Retract
    G1 E-2 F1800

    # Raise Z
    G1 Z10 F3000

    G90

    # Park
    G1 X220 Y220 F6000

    # Disable motors
    M84

    CLEAR_PAUSE

    BASE_CANCEL_PRINT

    M117 Cancelled


#####################################################################
# M600 - FILAMENT CHANGE
#####################################################################

[gcode_macro M600]
description: Filament change
gcode:

    {% set X = params.X|default(220)|float %}
    {% set Y = params.Y|default(220)|float %}
    {% set Z = params.Z|default(10)|float %}
    {% set E = params.E|default(5)|float %}

    SAVE_GCODE_STATE NAME=M600_state

    PAUSE

    G91

    # Retract old filament
    G1 E-{E} F1800

    # Lift nozzle
    G1 Z{Z} F3000

    G90

    # Park
    G1 X{X} Y{Y} F6000

    M117 Change filament

    # Wait for user
    RESPOND TYPE=command MSG="Insert new filament and RESUME"

    RESTORE_GCODE_STATE NAME=M600_state


#####################################################################
# LOAD FILAMENT
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: Load filament
gcode:

    {% set TEMP = params.TEMP|default(200)|float %}

    M117 Loading filament...

    {% if printer.extruder.temperature < TEMP %}
        M109 S{TEMP}
    {% endif %}

    M83

    G92 E0

    # Slowly load filament
    G1 E10 F300
    G1 E30 F1000
    G1 E10 F300

    G92 E0

    M117 Filament loaded


#####################################################################
# UNLOAD FILAMENT
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament
gcode:

    {% set TEMP = params.TEMP|default(200)|float %}

    M117 Unloading filament...

    {% if printer.extruder.temperature < TEMP %}
        M109 S{TEMP}
    {% endif %}

    M83

    G92 E0

    # Push slightly first
    G1 E5 F300

    # Retract
    G1 E-10 F1000
    G1 E-30 F1500
    G1 E-10 F1000

    G92 E0

    M117 Filament unloaded


#####################################################################
# PREHEAT PLA
#####################################################################

[gcode_macro PREHEAT_PLA]
description: Preheat PLA
gcode:

    M140 S60
    M104 S200

    M117 PLA heating...


#####################################################################
# PREHEAT ABS
#####################################################################

[gcode_macro PREHEAT_ABS]
description: Preheat ABS
gcode:

    M140 S100
    M104 S240

    M117 ABS heating...


#####################################################################
# COOL DOWN
#####################################################################

[gcode_macro COOL_DOWN]
description: Turn off heaters and fan
gcode:

    TURN_OFF_HEATERS
    M107

    M117 Cooling down...


#####################################################################
# BED MESH
#####################################################################

[gcode_macro BED_MESH]
description: Home and calibrate bed mesh
gcode:

    M117 Bed mesh calibration...

    G28

    BED_MESH_CALIBRATE

    BED_MESH_PROFILE SAVE=default

    M117 Mesh saved


#####################################################################
# LOAD BED MESH
#####################################################################

[gcode_macro LOAD_MESH]
description: Load default bed mesh
gcode:

    BED_MESH_PROFILE LOAD=default


#####################################################################
# SAVE BED MESH
#####################################################################

[gcode_macro SAVE_MESH]
description: Save current bed mesh
gcode:

    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG


#####################################################################
# HOME
#####################################################################

[gcode_macro HOME]
description: Home all axes
gcode:

    G28


#####################################################################
# SAFE Z HOME
#####################################################################

[gcode_macro SAFE_HOME]
description: Home all axes from center
gcode:

    G90

    G1 X117.5 Y117.5 F6000

    G28


#####################################################################
# PARK
#####################################################################

[gcode_macro PARK]
description: Park nozzle
gcode:

    G90

    G1 Z10 F3000
    G1 X220 Y220 F6000


#####################################################################
# PARK FRONT
#####################################################################

[gcode_macro PARK_FRONT]
description: Park nozzle at front
gcode:

    G90

    G1 Z10 F3000
    G1 X117 Y220 F6000


#####################################################################
# NOZZLE WIPE
#####################################################################

[gcode_macro WIPE_NOZZLE]
description: Wipe nozzle
gcode:

    G90

    G1 Z0.3 F3000

    G1 X10 Y10 F5000
    G1 X60 Y10 F1500
    G1 X10 Y10 F1500
    G1 X60 Y10 F1500

    G1 Z5 F3000


#####################################################################
# PURGE LINE
#####################################################################

[gcode_macro PURGE_LINE]
description: Purge nozzle
gcode:

    {% set TEMP = params.TEMP|default(200)|float %}

    {% if printer.extruder.temperature < TEMP %}
        M109 S{TEMP}
    {% endif %}

    G90
    M83

    G1 X5 Y10 Z0.28 F5000

    G92 E0

    G1 X55 Y10 Z0.28 F1500 E6
    G1 X60 Y10 Z0.28 F5000

    G92 E0


#####################################################################
# EXTRUDE 10MM
#####################################################################

[gcode_macro EXTRUDE_10]
description: Extrude 10mm
gcode:

    {% set TEMP = params.TEMP|default(200)|float %}

    {% if printer.extruder.temperature < TEMP %}
        M109 S{TEMP}
    {% endif %}

    M83
    G92 E0
    G1 E10 F300
    G92 E0


#####################################################################
# RETRACT 10MM
#####################################################################

[gcode_macro RETRACT_10]
description: Retract 10mm
gcode:

    M83
    G92 E0
    G1 E-10 F1800
    G92 E0


#####################################################################
# FILAMENT SENSOR
#####################################################################

[gcode_macro FILAMENT_STATUS]
description: Show filament sensor status
gcode:

    {% if printer["filament_switch_sensor filament_sensor"] is defined %}

        {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
            M117 Filament OK
        {% else %}
            M117 NO FILAMENT
        {% endif %}

    {% else %}

        M117 Sensor not configured

    {% endif %}


#####################################################################
# MOTORS OFF
#####################################################################

[gcode_macro MOTORS_OFF]
description: Disable stepper motors
gcode:

    M84


#####################################################################
# FAN ON
#####################################################################

[gcode_macro FAN_ON]
description: Fan 100%
gcode:

    M106 S255


#####################################################################
# FAN OFF
#####################################################################

[gcode_macro FAN_OFF]
description: Fan off
gcode:

    M107


#####################################################################
# FAN 50
#####################################################################

[gcode_macro FAN_50]
description: Fan 50%
gcode:

    M106 S128


#####################################################################
# SET BED TEMPERATURE
#####################################################################

[gcode_macro BED_TEMP]
description: Set bed temperature
gcode:

    {% set TEMP = params.S|default(60)|float %}

    M140 S{TEMP}


#####################################################################
# SET NOZZLE TEMPERATURE
#####################################################################

[gcode_macro NOZZLE_TEMP]
description: Set nozzle temperature
gcode:

    {% set TEMP = params.S|default(200)|float %}

    M104 S{TEMP}


#####################################################################
# PID EXTRUDER
#####################################################################

[gcode_macro PID_EXTRUDER]
description: PID tune extruder
gcode:

    {% set TEMP = params.TEMP|default(200)|float %}

    PID_CALIBRATE HEATER=extruder TARGET={TEMP}

    SAVE_CONFIG


#####################################################################
# PID BED
#####################################################################

[gcode_macro PID_BED]
description: PID tune bed
gcode:

    {% set TEMP = params.TEMP|default(60)|float %}

    PID_CALIBRATE HEATER=heater_bed TARGET={TEMP}

    SAVE_CONFIG


#####################################################################
# Z OFFSET TEST
#####################################################################

[gcode_macro Z_OFFSET_TEST]
description: Move nozzle for Z offset testing
gcode:

    G28

    G1 X117.5 Y117.5 F6000
    G1 Z5 F3000

    M117 Z offset test


#####################################################################
# CALIBRATE EXTRUDER
#####################################################################

[gcode_macro EXTRUDER_CALIBRATE]
description: Prepare extruder calibration
gcode:

    M117 Extruder calibration

    M83
    G92 E0

    M109 S200

    G1 E100 F100

    G92 E0

    M117 Measure actual extrusion


#####################################################################
# RESET EXTRUDER
#####################################################################

[gcode_macro RESET_EXTRUDER]
description: Reset extruder position
gcode:

    M83
    G92 E0


#####################################################################
# DISPLAY STATUS
#####################################################################

[gcode_macro STATUS]
description: Show printer status
gcode:

    M117 Klipper Ready


#####################################################################
# EMERGENCY STOP
#####################################################################

[gcode_macro KILL_PRINTER]
description: Emergency stop
gcode:

    M112


#####################################################################
# PRINT START ALIAS
#####################################################################

[gcode_macro PRINT_START]
description: Alias for START_PRINT
gcode:

    START_PRINT {rawparams}


#####################################################################
# PRINT END ALIAS
#####################################################################

[gcode_macro PRINT_END]
description: Alias for END_PRINT
gcode:

    END_PRINT