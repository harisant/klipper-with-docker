# Printer Config Profile: Voron 2.4 CoreXY

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG6
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG9
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100

[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 22.6789511
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4
min_temp: 10
max_temp: 270
control: pid
pid_Kp: 26.213
pid_Ki: 1.304
pid_Kd: 131.721

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.6
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182

[mcu]
serial: ${MCU_SERIAL}

[printer]
kinematics: corexy
max_velocity: ${PRINTER_MAX_VELOCITY}
max_accel: ${PRINTER_MAX_ACCEL}
max_z_velocity: ${PRINTER_MAX_Z_VELOCITY}
max_z_accel: ${PRINTER_MAX_Z_ACCEL}
