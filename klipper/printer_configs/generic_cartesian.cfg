# Printer Config Profile: Generic Cartesian Printer

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK6
control: pid
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 948.1
min_temp: 0
max_temp: 110

[fan]
pin: PH6

[mcu]
serial: ${MCU_SERIAL}

[printer]
kinematics: ${PRINTER_KINEMATICS}
max_velocity: ${PRINTER_MAX_VELOCITY}
max_accel: ${PRINTER_MAX_ACCEL}
max_z_velocity: ${PRINTER_MAX_Z_VELOCITY}
max_z_accel: ${PRINTER_MAX_Z_ACCEL}
