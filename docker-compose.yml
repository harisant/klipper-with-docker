services:

  klipper-builder:
    image: klipper-builder:latest
    build:
      context: ./klipper
      dockerfile: Dockerfile.builder
    container_name: klipper-builder
    profiles:
      - build

  klipper:
    image: klipper:latest
    build:
      context: ./klipper
      dockerfile: Dockerfile
    container_name: klipper
    restart: unless-stopped

    # Dibutuhkan agar Klipper dapat mengakses USB/serial MCU
    privileged: true

    volumes:
      - /dev:/dev
      - ./klipper/printer_data:/opt/printer_data

    environment:
      - TZ=Asia/Jakarta

    cap_add:
      - SYS_NICE

    networks:
      - klipper_net


  moonraker:
    image: moonraker:latest
    build:
      context: ./moonraker
      dockerfile: Dockerfile
    container_name: moonraker
    restart: unless-stopped

    ports:
      - "7125:7125"

    volumes:
      - ./klipper/printer_data:/opt/printer_data
      - ./moonraker/moonraker.conf:/opt/printer_data/config/moonraker.conf:ro

    depends_on:
      - klipper

    networks:
      - klipper_net


  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:latest
    container_name: mainsail
    restart: unless-stopped

    volumes:
    - ./mainsail/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    ports:
      - "8000:8080"

    depends_on:
      - moonraker

    networks:
      - klipper_net


networks:
  klipper_net:
    driver: bridge
