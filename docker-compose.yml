services:

  klipper-builder:
    image: klipper-builder:latest
    build:
      context: ./klipper
      dockerfile: Dockerfile.builder
    container_name: klipper-builder
    profiles:
      - build
    privileged: true
    volumes:
      - /dev:/dev

  klipper:
    image: klipper:latest
    build:
      context: ./klipper
      dockerfile: Dockerfile
    container_name: klipper
    restart: unless-stopped
    env_file:
      - .env

    # Dibutuhkan agar Klipper dapat mengakses USB/serial MCU
    privileged: true

    volumes:
      - /dev:/dev
      - ./klipper/printer_data:/opt/printer_data
      - ./klipper/printer_configs:/opt/printer_configs:ro

    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - PRINTER_TYPE=${PRINTER_TYPE:-ender3_pro}
      - MCU_SERIAL=${MCU_SERIAL:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}
      - PRINTER_KINEMATICS=${PRINTER_KINEMATICS:-cartesian}
      - PRINTER_MAX_VELOCITY=${PRINTER_MAX_VELOCITY:-300}
      - PRINTER_MAX_ACCEL=${PRINTER_MAX_ACCEL:-3000}
      - PRINTER_MAX_Z_VELOCITY=${PRINTER_MAX_Z_VELOCITY:-5}
      - PRINTER_MAX_Z_ACCEL=${PRINTER_MAX_Z_ACCEL:-100}

    cap_add:
      - SYS_NICE

    networks:
      - klipper_net

  moonraker:
    image: moonraker:latest
    build:
      context: ./moonraker
      dockerfile: Dockerfile
    container_name: moonraker
    restart: unless-stopped
    env_file:
      - .env

    ports:
      - "${MOONRAKER_PORT:-7125}:7125"

    volumes:
      - ./klipper/printer_data:/opt/printer_data
      - ./moonraker/moonraker.conf:/opt/printer_data/config/moonraker.conf:ro

    depends_on:
      - klipper

    networks:
      - klipper_net

  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:latest
    container_name: mainsail
    restart: unless-stopped
    env_file:
      - .env

    volumes:
      - ./mainsail/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    ports:
      - "${MAINSAIL_PORT:-8000}:8080"

    depends_on:
      - moonraker

    networks:
      - klipper_net

networks:
  klipper_net:
    driver: bridge
